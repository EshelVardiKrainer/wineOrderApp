version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wine-orders-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wine_user
      POSTGRES_PASSWORD: wine_pass
      POSTGRES_DB: wine_orders
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wine-orders-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wine.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  pgdata:
